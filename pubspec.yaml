name: orsocook
description: "OrsoCook - App social per ricette"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Routing
  go_router: ^17.2.0
  
  # Networking
  http: ^1.2.2
  dio: ^5.0.0
  http_parser: ^4.0.2
  
  # State Management & Storage
  provider: ^6.1.2
  shared_preferences: ^2.5.5
  
  # UI & Icons
  cupertino_icons: ^1.0.8
  responsive_adaptive_ui: ^0.0.2 
  
  # File & Images
  image_picker: ^1.0.4
  path: ^1.9.0

  # Web utilities (cross-platform)
  universal_html: ^2.2.4
  
  # Carousel
  carousel_slider: ^5.0.0
  
  # Shimmer effect
  shimmer: ^3.0.0
  google_fonts: ^8.0.2
  url_launcher: ^6.3.2
  file_picker: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/