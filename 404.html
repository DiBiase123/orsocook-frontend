<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrsoCook - Reindirizzamento</title>
  <script>
    (function() {
      console.log('🔍 404.html CARICATO - URL:', window.location.href);
      
      // Estrai token dalla query string
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      
      if (token) {
        console.log('🔍 Token TROVATO in 404.html:', token);
        localStorage.setItem('pendingVerificationToken', token);
        sessionStorage.setItem('pendingVerificationToken', token);
        console.log('🔍 Token salvato in storage');
      }
      
      // Reindirizza a /#/verify-email (con hash per Flutter web)
      let redirectUrl = '/orsocook-frontend/';
      if (token) {
        redirectUrl += '#/verify-email?token=' + token;
      } else {
        redirectUrl += '#/verify-email';
      }
      
      console.log('🔍 Redirect a:', redirectUrl);
      window.location.replace(redirectUrl);
    })();
  </script>
</head>
<body>
  <p>Reindirizzamento in corso...</p>
</body>
</html>
